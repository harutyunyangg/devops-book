site_name: DevOps ուսումնական ձեռնարկ
site_description: Հայերեն, գործնական DevOps ուղեցույց
site_url: https://example.invalid/devops-book/
repo_name: DevOps Book
theme:
  name: material
  language: hy
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Սկիզբ: index.md
  - Linux: linux.md
  - Automation և IaC: automation-iac.md
  - Containers: containers.md
  - Python: python.md
  - Security, Observability և Cloud: security.md
  - Բառարան: glossary.md

exclude_docs: |
  _template.md
