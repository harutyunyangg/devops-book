site_name: DevOps ուսումնական ձեռնարկ
site_description: Հայերեն, գործնական DevOps ուղեցույց
site_url: https://example.invalid/devops-book/
repo_name: DevOps Book
theme:
  name: material
  language: hy
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Սկիզբ: index.md
  - Linux:
      - Overview: linux/index.md
      - Processes: linux/processes.md
      - Bash Scripting: linux/bash-scripting.md
      - Cgroups: linux/cgroups.md
      - Networking: linux/networking.md
      - Firewall: linux/firewall.md
  - Networks: networking/index.md
  - Git և CI/CD: git-ci-cd/index.md
  - Automation և IaC:
      - Overview: automation-iac/index.md
      - Ansible: automation-iac/ansible.md
      - YAML: automation-iac/yaml.md
  - Docker և Kubernetes: docker-kubernetes/index.md
  - Cloud, Security, Observability:
      - Overview: cloud-security-observability/index.md
      - Least Privilege: cloud-security-observability/least-privilege.md
  - Բառարան: glossary.md
